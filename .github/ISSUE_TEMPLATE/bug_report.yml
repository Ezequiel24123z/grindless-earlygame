name: T0 bug report
description: Report a reproducible Grindless T0 problem with revision-bound evidence.
title: "[T0] "
body:
  - type: markdown
    attributes:
      value: |
        Report one problem per issue. A controlled developer smoke is not a
        no-command playthrough or human acceptance.

        **Privacy:** do not include account names or IDs, email addresses,
        passwords, tokens, API keys, server addresses, private host paths,
        launcher authentication screens, or complete world saves. Redact logs
        and screenshots before attaching them. In-world coordinates are optional;
        share them only when necessary and without identifying a server or person.
  - type: input
    id: source_revision
    attributes:
      label: Source revision
      description: Exact tested Git commit, not just the branch or latest main.
      placeholder: Full commit SHA, or MISSING with an explanation
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Mod and pack artifact
      description: Mod/pack versions, JAR and ZIP SHA-256, and public build provenance when available. Distinguish the installed runtime from a documentation revision.
      placeholder: |
        Mod version:
        Pack version/profile:
        Installed runtime revision:
        JAR SHA-256:
        Pack ZIP SHA-256:
        Public build/receipt reference:
        Mark unavailable fields MISSING; do not paste private paths.
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      description: Record the actual loader. Reporting a different loader does not establish support for it.
      options:
        - Forge
        - NeoForge
        - Another loader (specify in versions)
        - Unknown
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, loader and Java versions
      description: Include exact versions and relevant optional mods. Do not include device or account identifiers.
      placeholder: "Minecraft: ...; loader: ...; Java: ...; relevant optional mods: ..."
    validations:
      required: true
  - type: dropdown
    id: observation_mode
    attributes:
      label: Observation mode
      options:
        - Controlled developer smoke (commands or staged resources)
        - Human no-command playthrough
        - Automated check or headless server
        - Source or resource inspection only
    validations:
      required: true
  - type: dropdown
    id: world_type
    attributes:
      label: World type
      options:
        - Superflat
        - Normal Overworld
        - Custom preset or dimension (describe below)
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: world_history
    attributes:
      label: New or existing world
      options:
        - New world created on this candidate
        - Existing world reopened on the same candidate
        - Preserved copy upgraded from an older candidate
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: world_context
    attributes:
      label: World context and optional in-world coordinates
      description: Relevant preset/dimension, single-player or multiplayer, prior revision for an upgrade, and backup status. Coordinates are optional and must be game coordinates only.
      placeholder: Do not include a server address, real location, player identity, private save path or full world upload.
  - type: input
    id: affected_surface
    attributes:
      label: Machine, process, quest or milestone
      description: Use the actual registry/quest/offer ID where known. Protocol milestone numbers are not quest IDs. Write N/A when unrelated.
      placeholder: "Machine/process/quest/offer ID: ...; protocol milestone: ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite the current in-game explanation or canonical recipe/quest when relevant. Separate an expectation from an implemented contract.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include visible state, losses/duplication, blocked reason and recovery outcome. Do not infer a pass from item possession or successful startup.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Starting state, exact actions, inputs, side/orientation and observed result. Identify all commands, spawned resources or quest repairs; never mix them into no-command evidence.
      placeholder: |
        1. Start from ...
        2. Perform ...
        3. Observe ...
        Frequency:
        Workaround or recovery attempted:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach minimal redacted log excerpts, screenshots or recordings, or public proof links. Include observation time and relevant before/after counts. Preserve failed attempts; do not upload credentials, private host paths or whole saves.
      placeholder: Evidence reference and scope, or MISSING with an explanation.
  - type: dropdown
    id: severity
    attributes:
      label: Reported severity
      description: Initial reporter assessment, subject to triage.
      options:
        - Critical - save corruption, irreversible loss or duplication
        - High - crash, progression blocked or required gate broken
        - Medium - degraded behavior with a safe workaround
        - Low - cosmetic or minor clarity problem
        - Uncertain - needs triage
    validations:
      required: true
  - type: dropdown
    id: blocking
    attributes:
      label: Blocking status
      options:
        - Blocks a required pre-playthrough technical gate
        - Blocks the player's progression or recovery
        - Blocks both the technical gate and progression
        - Does not block either
        - Uncertain - needs triage
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked the report and attachments for accounts, credentials, tokens, private host paths and other personal information.
          required: true
