name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and the offline behaviour checks. Neither instantiates Forge, which is why the smoke
  # jobs below exist at all (ADR-0049).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Behaviour checks
        run: tools/run-checks.sh .

  # Every scenario in tools/smoke/scenarios.txt, spread across parallel shards.
  #
  # These used to be 39 steps in one sequential job. Each one boots a full dedicated server, so
  # the job grew past `timeout-minutes: 45` and every run from the interstellar-travel branch
  # onwards was killed at 45 minutes and reported as "cancelled" -- six pull requests merged
  # without the smoke evidence ADR-0049 requires. Sharding is the fix (ADR-0105).
  #
  # Adding a scenario means adding a line to scenarios.txt, never a step here.
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke shard ${{ matrix.shard }}
        run: tools/run-smokes.sh . --shard ${{ matrix.shard }} --of 6

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-shard-${{ matrix.shard }}
          path: forge/run/smoke-*.log
          if-no-files-found: ignore
