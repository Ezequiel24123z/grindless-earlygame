name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prism-tooling-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check isolated Prism and SSH workflow contracts
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\checks\Test-PrismDev.ps1

      - name: Check the Git Bash tooling twin
        shell: bash
        run: bash tools/checks/Test-PrismDev.sh

  # Build and the offline behaviour checks. Neither instantiates Forge, which is why the smoke
  # jobs below exist at all (ADR-0049).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check JDK runner diagnostics
        run: bash tools/checks/verify-runner-jdk.sh .

      - name: Foundation validation
        run: bash tools/validate.sh .

      - name: Check offline sound calibration guards
        run: bash tools/sound-design/test-sound-design.sh

      - name: Verify and export canonical dashboard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bash tools/dashboard/tests/verify-export-root.sh --compile
          bash tools/dashboard/export.sh --mode pr

      - name: Upload canonical dashboard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: canonical-dashboard
          path: build/dashboard/site
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-validation
          path: build/validation/
          if-no-files-found: warn

  # Every scenario in tools/smoke/scenarios.txt, spread across parallel shards.
  #
  # These used to be 39 steps in one sequential job. Each one boots a full dedicated server, so
  # the job grew past `timeout-minutes: 45` and every run from the interstellar-travel branch
  # onwards was killed at 45 minutes and reported as "cancelled" -- six pull requests merged
  # without the smoke evidence ADR-0049 requires. Sharding is the fix (ADR-0105).
  #
  # Adding a scenario means adding a line to scenarios.txt, never a step here.
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke shard ${{ matrix.shard }}
        run: tools/run-smokes.sh . --shard ${{ matrix.shard }} --of 6

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-shard-${{ matrix.shard }}
          path: forge/run/smoke-*.log
          if-no-files-found: ignore
