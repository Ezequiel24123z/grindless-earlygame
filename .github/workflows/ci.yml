name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Behaviour checks
        run: tools/run-checks.sh .

      # ADR-0049: build and checks never instantiate Forge, so only booting the server proves
      # the mod can load. CI=true is set by Actions and authorises writing eula.txt.
      - name: Boot the dedicated server
        run: tools/smoke-boot.sh .

      # ADR-0050: the same boot with a datapack standing in for another mod that already provides
      # tin ingots and raw platinum. Two Grindless supply items must step aside.
      - name: Boot with foreign material providers
        run: tools/smoke-boot.sh .
        env:
          SMOKE_DATAPACK: ${{ github.workspace }}/tools/smoke/foreign-providers
          SMOKE_EXPECT: '32 materials found; Grindless supplies 130 of its 132'

      # Every block must be mineable with a pickaxe and drop itself, with its real display name.
      - name: Boot and exercise block loot and mining tags
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/blocks.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/blocks.expect

      # Every status and facing of every machine must be a valid block state. The placements run
      # as one datapack function so a ticking block entity cannot rewrite status before execute-if
      # (ADR-0061). Hopper smokes still send console lines a second apart; they need those ticks.
      - name: Boot and place every machine state
        run: tools/smoke-boot.sh .
        env:
          SMOKE_DATAPACK: ${{ github.workspace }}/tools/smoke/states-pack
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/states.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/states.expect

      # The extractor has a block entity, and a pylon occupies the two blocks above it.
      - name: Boot and exercise extractor and pylon tower
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/loop.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/loop.expect

      # The Research Terminal has a block entity; T0 recipes are checked offline by VerifyBootstrap.
      - name: Boot and place the Research Terminal
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/bootstrap.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/bootstrap.expect

      # Slice A: Thermal Generator, Pulverizer and Arc Furnace have block entities; hoppers feed fuel.
      - name: Boot and exercise first iron machines
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-iron.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-iron.expect

      # Slice B: belts accept a hopper, items move as lane data, T1 factory blocks place.
      - name: Boot and exercise first factory
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-factory.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-factory.expect

      # Slice C: pump water through clay into a tank; captured CO burns in the generator.
      - name: Boot and exercise first fluids
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-fluids.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-fluids.expect

      # Slice D: Press and Assembler place; a hopper cannot steal a die and can insert an ingot.
      - name: Boot and exercise first assembler
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-assembler.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-assembler.expect

      # Slice E: capacitor and transformer place; they are not pylons (ADR-0064).
      - name: Boot and exercise energy spanning
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-energy.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-energy.expect

      # Kiln / R2: the Kiln places; a hopper can insert raw; a tank is the named SO2 sink.
      - name: Boot and exercise first kiln
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-kiln.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-kiln.expect

      # Process Atlas: the handheld exists so a pack without JEI can still see the graph.
      - name: Boot and exercise process atlas
        run: tools/smoke-boot.sh .
        env:
          SMOKE_COMMANDS: ${{ github.workspace }}/tools/smoke/first-atlas.commands
          SMOKE_EXPECT_FILE: ${{ github.workspace }}/tools/smoke/first-atlas.expect

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-boot-log
          path: forge/run/smoke-boot.log
          if-no-files-found: ignore
