org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=grindless
mod_name=Grindless
mod_version=0.1.0
mod_license=MIT
mod_description=Factorio-inspired futuristic automation that removes the Minecraft early-game grind.
mod_author=Ezequiel24123z
maven_group=io.github.ezequiel24123z.grindless
archives_base_name=grindless

# Loader platforms compiled from the `common` sources.
# Forge is the only target (ADR-0039). On 1.20.1 NeoForge is a soft-fork of Forge 47
# and loads the Forge jar unchanged, so there is deliberately no separate `neoforge`
# platform either (ADR-0002).
enabled_platforms=forge

# Minecraft / toolchain
minecraft_version=1.20.1
supported_minecraft_versions=1.20.1
java_version=17
parchment_version=2023.09.03

# Architectury
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.423
architectury_api_version=9.2.14

# Fabric loader, compile-time only.
# Not a build target: Architectury's `common` project is compiled in a Fabric-shaped
# environment by Loom even when Fabric is not a platform, so this coordinate is still
# needed to resolve the common sources. Nothing Fabric ships in the jar (ADR-0039).
fabric_loader_version=0.16.14

# Forge (the same artifact set also loads on NeoForge 1.20.1-47.1.x)
forge_version=1.20.1-47.4.23
neoforge_legacy_version=1.20.1-47.1.106
neoforge_loader_range=[47,)
