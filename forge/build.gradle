plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    smokeInstaller {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    smokeMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:${rootProject.jei_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}"
    modCompileOnly("curse.maven:heracles-845831:${rootProject.heracles_curse_file}") { transitive = false }
    modCompileOnly("curse.maven:resourceful-lib-570073:${rootProject.resourcefullib_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:heracles-845831:${rootProject.heracles_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:resourceful-lib-570073:${rootProject.resourcefullib_curse_file}") { transitive = false }
    smokeInstaller "net.minecraftforge:forge:${rootProject.forge_version}:installer"
    smokeMods "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_loader_range", rootProject.neoforge_loader_range

    filesMatching("META-INF/mods.toml") {
        expand([
                "version"              : project.version,
                "minecraft_version"    : rootProject.minecraft_version,
                "neoforge_loader_range": rootProject.neoforge_loader_range
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

// This jar is also the NeoForge 1.20.1 artifact: NeoForge 47.1.x is a soft-fork of
// Forge 47.x that keeps the `net.minecraftforge` packages and `META-INF/mods.toml`
// format, so a single binary serves both loaders. See ADR-0002.
remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "forge"
}

def smokeServer = layout.projectDirectory.dir("run/smoke-server")
def smokeInventory = smokeServer.file("installation-files.txt")
tasks.register("installSmokeServer", JavaExec) {
    classpath = configurations.smokeInstaller
    mainClass.set("net.minecraftforge.installer.SimpleInstaller")
    workingDir smokeServer.asFile
    args "--installServer", smokeServer.asFile.absolutePath
    inputs.property "forgeVersion", rootProject.forge_version
    outputs.dir(smokeServer.dir("libraries"))
    outputs.files(
            smokeServer.file("libraries/net/minecraftforge/forge/${rootProject.forge_version}/win_args.txt"),
            smokeServer.file("libraries/net/minecraftforge/forge/${rootProject.forge_version}/unix_args.txt"),
            smokeInventory)
    outputs.upToDateWhen {
        def inventory = smokeInventory.asFile
        if (!inventory.isFile()) {
            return false
        }
        def entries = inventory.readLines("UTF-8")
        !entries.isEmpty() && entries.every { line ->
            def entry = line.split("\t", 2)
            def installed = new File(smokeServer.asFile, entry[0])
            entry.length == 2 && installed.isFile() && installed.length().toString() == entry[1]
        }
    }
    doFirst {
        smokeServer.asFile.mkdirs()
    }
    doLast {
        def libraries = fileTree(smokeServer.dir("libraries")).matching {
            include "**/*.jar", "**/*_args.txt"
        }.files.sort()
        if (libraries.isEmpty()) {
            throw new GradleException("Forge installation did not produce runtime libraries")
        }
        smokeInventory.asFile.setText(libraries.collect { file ->
            "${smokeServer.asFile.toPath().relativize(file.toPath())}\t${file.length()}"
        }.join("\n") + "\n", "UTF-8")
    }
}

// Test the distributable jars without the development transformer's persistent worker pools.
tasks.register("prepareSmokeServer", Copy) {
    dependsOn tasks.named("installSmokeServer"), tasks.named("remapJar")
    from(tasks.named("remapJar").flatMap { it.archiveFile }) {
        rename { "grindless.jar" }
    }
    from(configurations.smokeMods) {
        rename { "architectury.jar" }
    }
    into smokeServer.dir("mods")
}
