plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    smokeInstaller {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    smokeMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    questSmokeMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    ftbPublisherArtifacts {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:${rootProject.jei_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}"
    modCompileOnly("curse.maven:heracles-845831:${rootProject.heracles_curse_file}") { transitive = false }
    modCompileOnly("curse.maven:resourceful-lib-570073:${rootProject.resourcefullib_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:heracles-845831:${rootProject.heracles_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:resourceful-lib-570073:${rootProject.resourcefullib_curse_file}") { transitive = false }
    modCompileOnly("curse.maven:ftb-quests-289412:${rootProject.ftbquests_curse_file}") { transitive = false }
    modCompileOnly("curse.maven:ftb-library-404465:${rootProject.ftblibrary_curse_file}") { transitive = false }
    modCompileOnly("curse.maven:ftb-teams-404468:${rootProject.ftbteams_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:ftb-quests-289412:${rootProject.ftbquests_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:ftb-library-404465:${rootProject.ftblibrary_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:ftb-teams-404468:${rootProject.ftbteams_curse_file}") { transitive = false }
    modRuntimeOnly("curse.maven:ftb-xmod-compat-889915:${rootProject.ftbxmodcompat_curse_file}") { transitive = false }
    smokeInstaller "net.minecraftforge:forge:${rootProject.forge_version}:installer"
    smokeMods "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"
    questSmokeMods "curse.maven:ftb-quests-289412:${rootProject.ftbquests_curse_file}"
    questSmokeMods "curse.maven:ftb-library-404465:${rootProject.ftblibrary_curse_file}"
    questSmokeMods "curse.maven:ftb-teams-404468:${rootProject.ftbteams_curse_file}"
    questSmokeMods "curse.maven:ftb-xmod-compat-889915:${rootProject.ftbxmodcompat_curse_file}"
    questSmokeMods "mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}"
    ftbPublisherArtifacts "curse.maven:ftb-quests-289412:${rootProject.ftbquests_curse_file}"
    ftbPublisherArtifacts "curse.maven:ftb-library-404465:${rootProject.ftblibrary_curse_file}"
    ftbPublisherArtifacts "curse.maven:ftb-teams-404468:${rootProject.ftbteams_curse_file}"
    ftbPublisherArtifacts "curse.maven:ftb-xmod-compat-889915:${rootProject.ftbxmodcompat_curse_file}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_loader_range", rootProject.neoforge_loader_range
    inputs.property "heracles_version", rootProject.heracles_version
    inputs.property "ftbquests_version", rootProject.ftbquests_version

    filesMatching("META-INF/mods.toml") {
        expand([
                "version"              : project.version,
                "minecraft_version"    : rootProject.minecraft_version,
                "neoforge_loader_range": rootProject.neoforge_loader_range,
                "heracles_version"     : rootProject.heracles_version,
                "ftbquests_version"    : rootProject.ftbquests_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

// This jar is also the NeoForge 1.20.1 artifact: NeoForge 47.1.x is a soft-fork of
// Forge 47.x that keeps the `net.minecraftforge` packages and `META-INF/mods.toml`
// format, so a single binary serves both loaders. See ADR-0002.
remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "forge"
}

// The common checks inspect Forge's actual resolved resources without loading Forge classes.
tasks.register("writeSustainabilityPackClasspath") {
    def destination = layout.buildDirectory.file("checks/sustainability-pack-classpath.json")
    inputs.files(configurations.compileClasspath)
    inputs.property "minecraftVersion", rootProject.minecraft_version
    inputs.property "forgeVersion", rootProject.forge_version
    outputs.file(destination)
    doLast {
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        file.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schema_version: 1,
                gradle_configuration: "forge:compileClasspath",
                minecraft_version: rootProject.minecraft_version,
                forge_version: rootProject.forge_version,
                classpath: configurations.compileClasspath.files.collect { it.absolutePath }
        ])) + "\n", "UTF-8")
    }
}

def smokeServer = layout.projectDirectory.dir("run/smoke-server")
def smokeInventory = smokeServer.file("installation-files.txt")
tasks.register("installSmokeServer", JavaExec) {
    classpath = configurations.smokeInstaller
    mainClass.set("net.minecraftforge.installer.SimpleInstaller")
    workingDir smokeServer.asFile
    args "--installServer", smokeServer.asFile.absolutePath
    inputs.property "forgeVersion", rootProject.forge_version
    outputs.dir(smokeServer.dir("libraries"))
    outputs.files(
            smokeServer.file("libraries/net/minecraftforge/forge/${rootProject.forge_version}/win_args.txt"),
            smokeServer.file("libraries/net/minecraftforge/forge/${rootProject.forge_version}/unix_args.txt"),
            smokeInventory)
    outputs.upToDateWhen {
        def inventory = smokeInventory.asFile
        if (!inventory.isFile()) {
            return false
        }
        def entries = inventory.readLines("UTF-8")
        !entries.isEmpty() && entries.every { line ->
            def entry = line.split("\t", 2)
            def installed = new File(smokeServer.asFile, entry[0])
            entry.length == 2 && installed.isFile() && installed.length().toString() == entry[1]
        }
    }
    doFirst {
        smokeServer.asFile.mkdirs()
    }
    doLast {
        def libraries = fileTree(smokeServer.dir("libraries")).matching {
            include "**/*.jar", "**/*_args.txt"
        }.files.sort()
        if (libraries.isEmpty()) {
            throw new GradleException("Forge installation did not produce runtime libraries")
        }
        smokeInventory.asFile.setText(libraries.collect { file ->
            "${smokeServer.asFile.toPath().relativize(file.toPath())}\t${file.length()}"
        }.join("\n") + "\n", "UTF-8")
    }
}

// Test the distributable jars without the development transformer's persistent worker pools.
// One Sync owns the complete mods inventory, including transitions back from the native backend.
def prepareSmokeServer = tasks.register("prepareSmokeServer", Sync) {
    dependsOn tasks.named("installSmokeServer"), tasks.named("remapJar")
    mustRunAfter "verifyFtbPublisherArtifacts"
    from(tasks.named("remapJar").flatMap { it.archiveFile }) {
        rename { "grindless.jar" }
    }
    from(configurations.smokeMods) {
        rename { "architectury.jar" }
    }
    into smokeServer.dir("mods")
}

tasks.register("prepareQuestSmokeServer") {
    dependsOn prepareSmokeServer, tasks.named("verifyFtbPublisherArtifacts")
}

// The existing harness selects the alias for SMOKE_QUEST_BACKEND=ftb. Wait for the
// complete graph (including indirect alias requests) before choosing these external jars.
gradle.taskGraph.whenReady { graph ->
    def nativeQuests = graph.hasTask("${project.path}:prepareQuestSmokeServer")
    prepareSmokeServer.configure {
        inputs.property("questBackend", nativeQuests ? "ftb" : "none")
        if (nativeQuests) {
            from(configurations.questSmokeMods)
        }
    }
}

sourceSets {
    questBackendChecks {
        java.srcDir rootProject.file("tools/quest-checks")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + fileTree(layout.buildDirectory.dir("quest-checks/libraries")) {
            include "*.jar"
        }
    }
}

tasks.register("extractQuestCheckLibraries", Sync) {
    from({ configurations.modCompileOnly.collect { zipTree(it) } }) {
        include "META-INF/jars/bytecodecs-*.jar", "META-INF/jars/yabn-*.jar"
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir("quest-checks/libraries")
}

tasks.register("verifyQuestBackend", JavaExec) {
    group = "verification"
    description = "Checks the pinned native quest codec, claim projection, owned files and packet contract."
    dependsOn tasks.named("questBackendChecksClasses"), tasks.named("extractQuestCheckLibraries")
    // This standalone contract check needs vanilla Bootstrap, not Forge's untransformed event bus.
    classpath = files(project(":common").sourceSets.main.runtimeClasspath, sourceSets.questBackendChecks.runtimeClasspath)
    mainClass.set("io.github.ezequiel24123z.grindless.forge.quest.VerifyHeracles")
    workingDir rootProject.projectDir
    maxHeapSize = "512m"
    jvmArgs "-XX:ActiveProcessorCount=2"
}

tasks.register("verifyFtbQuestBackend", JavaExec) {
    group = "verification"
    description = "Checks the pinned native FTB loader, stable graph and receipt-only migration."
    dependsOn tasks.named("questBackendChecksClasses"), tasks.named("extractQuestCheckLibraries"),
            tasks.named("verifyFtbPublisherArtifacts")
    classpath = files(project(":common").sourceSets.main.runtimeClasspath, sourceSets.questBackendChecks.runtimeClasspath)
    mainClass.set("io.github.ezequiel24123z.grindless.forge.quest.VerifyFtbQuests")
    workingDir rootProject.projectDir
    maxHeapSize = "512m"
    jvmArgs "-XX:ActiveProcessorCount=2"
}

// A legacy export runs this publisher's source file against the actual pinned checkout's
// existing classes/libraries. It never reconstructs the old catalogue from current data.
tasks.register("publishFtbQuestDefinitions", JavaExec) {
    group = "build"
    description = "Publishes source/runtime/hash-bound native chapters, including an authentic pinned legacy checkout."
    def legacyRoot = providers.gradleProperty("ftbDefinitionRoot")
    def producer = file("src/main/java/io/github/ezequiel24123z/grindless/forge/quest/FtbQuestDefinitionPublisher.java")
    if (legacyRoot.isPresent()) {
        mainClass.set(producer.absolutePath)
        classpath = files(provider {
            def sourceRoot = rootProject.file(legacyRoot.get())
            def descriptor = new File(sourceRoot, "forge/build/checks/sustainability-pack-classpath.json")
            if (!descriptor.isFile()) {
                throw new GradleException("Prepare the pinned checkout with :forge:classes :forge:writeSustainabilityPackClasspath :forge:extractQuestCheckLibraries first.")
            }
            def recorded = new groovy.json.JsonSlurper().parse(descriptor)
            if (recorded.schema_version != 1 || recorded.gradle_configuration != "forge:compileClasspath" ||
                    !(recorded.classpath instanceof List) || recorded.classpath.isEmpty()) {
                throw new GradleException("Invalid pinned publisher classpath descriptor.")
            }
            def classes = ["forge/build/classes/java/main", "common/build/classes/java/main"].collect {
                def directory = new File(sourceRoot, it)
                if (!directory.isDirectory()) { throw new GradleException("Missing pinned generator classes: $it") }
                directory
            }
            classes + ["forge/build/resources/main", "common/build/resources/main"].collect { new File(sourceRoot, it) } +
                    recorded.classpath.collect { new File(it) } +
                    fileTree(new File(sourceRoot, "forge/build/quest-checks/libraries")) { include "*.jar" }.files
        })
    } else {
        dependsOn tasks.named("classes"), tasks.named("extractQuestCheckLibraries"),
                tasks.named("verifyFtbPublisherArtifacts"), tasks.named("remapJar")
        classpath = files(project(":common").sourceSets.main.runtimeClasspath,
                sourceSets.main.runtimeClasspath, fileTree(layout.buildDirectory.dir("quest-checks/libraries")) { include "*.jar" })
        mainClass.set("io.github.ezequiel24123z.grindless.forge.quest.FtbQuestDefinitionPublisher")
    }
    workingDir rootProject.projectDir
    maxHeapSize = "512m"
    jvmArgs "-XX:ActiveProcessorCount=2"
    doFirst {
        def source = providers.gradleProperty("ftbDefinitionSourceRevision").get()
        def runtime = providers.gradleProperty("ftbDefinitionRuntimeRevision").getOrElse(source)
        def sourceRoot = legacyRoot.isPresent() ? rootProject.file(legacyRoot.get()) : rootProject.projectDir
        def jar = legacyRoot.isPresent() ? rootProject.file(providers.gradleProperty("ftbDefinitionJar").get()) :
                tasks.named("remapJar").get().archiveFile.get().asFile
        def digest = legacyRoot.isPresent() ? providers.gradleProperty("ftbDefinitionJarSha256").get() :
                java.security.MessageDigest.getInstance("SHA-256").digest(jar.bytes).encodeHex().toString()
        def output = providers.gradleProperty("ftbDefinitionOutput").isPresent() ?
                rootProject.file(providers.gradleProperty("ftbDefinitionOutput").get()) :
                new File(sourceRoot, "forge/build/ftb-definitions/definitions-${source}.json")
        setArgs([sourceRoot.absolutePath, source, runtime, jar.absolutePath, digest, output.absolutePath])
    }
}

tasks.register("prepareFtbQuestUpdate", JavaExec) {
    group = "build"
    description = "Native-SNBT preflight for an explicit stopped-target definition update; never writes the instance."
    dependsOn tasks.named("classes"), tasks.named("extractQuestCheckLibraries"),
            tasks.named("verifyFtbPublisherArtifacts"), tasks.named("remapJar")
    classpath = files(project(":common").sourceSets.main.runtimeClasspath,
            sourceSets.main.runtimeClasspath, fileTree(layout.buildDirectory.dir("quest-checks/libraries")) { include "*.jar" })
    mainClass.set("io.github.ezequiel24123z.grindless.forge.quest.FtbQuestUpdatePlanner")
    workingDir rootProject.projectDir
    maxHeapSize = "512m"
    jvmArgs "-XX:ActiveProcessorCount=2"
    doFirst {
        def source = providers.gradleProperty("ftbDefinitionSourceRevision").get()
        def runtime = providers.gradleProperty("ftbDefinitionRuntimeRevision").getOrElse(source)
        def jar = tasks.named("remapJar").get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(jar.bytes).encodeHex().toString()
        def previous = rootProject.file(providers.gradleProperty("ftbPreviousDefinitions").get())
        def instance = rootProject.file(providers.gradleProperty("ftbDefinitionInstance").get())
        def output = providers.gradleProperty("ftbDefinitionOutput").isPresent() ?
                rootProject.file(providers.gradleProperty("ftbDefinitionOutput").get()) :
                layout.buildDirectory.file("ftb-definitions/update-${source}.json").get().asFile
        setArgs([rootProject.projectDir.absolutePath, source, runtime, jar.absolutePath, digest, instance.absolutePath,
                 previous.absolutePath, providers.gradleProperty("ftbPreviousDefinitionsSha256").get(), output.absolutePath])
    }
}

tasks.register("verifyFtbPublisherArtifacts") {
    group = "verification"
    description = "Matches the four resolved FTB publisher jars to the independently verified release bytes."
    inputs.files(configurations.ftbPublisherArtifacts)
    inputs.file(rootProject.file("pack/dependency-metadata.json"))
    doLast {
        def projects = ["ftb-quests-289412": 289412, "ftb-library-404465": 404465,
                        "ftb-teams-404468": 404468, "ftb-xmod-compat-889915": 889915]
        def records = new groovy.json.JsonSlurper()
                .parse(rootProject.file("pack/dependency-metadata.json")).files
        def artifacts = configurations.ftbPublisherArtifacts.resolvedConfiguration.resolvedArtifacts
        if (artifacts.size() != projects.size()) {
            throw new GradleException("Unexpected FTB publisher artifact closure")
        }
        artifacts.each { artifact ->
            def module = artifact.moduleVersion.id
            def record = records.find { it.projectID == projects[module.name] }
            def digest = { algorithm -> java.security.MessageDigest.getInstance(algorithm)
                    .digest(artifact.file.bytes).encodeHex().toString() }
            if (module.group != "curse.maven" || record == null ||
                    module.version != record.fileID.toString() || artifact.file.length() != record.bytes ||
                    digest("SHA-1") != record.sha1 || digest("SHA-256") != record.sha256) {
                throw new GradleException("Resolved FTB publisher bytes differ from verified metadata: ${module}")
            }
        }
        logger.lifecycle("Verified all four FTB publisher artifacts against release SHA-1/SHA-256 and sizes")
    }
}
